<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROCURE SHOP</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #1e40af;
      --dark: #0f172a;
      --success: #10b981;
      --gray: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e6f0ff 100%);
      color: var(--dark);
      line-height: 1.6;
      padding-bottom: 80px;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(to right, var(--primary), #1d4ed8);
      color: white;
      padding: 1.4rem 1.5rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
    }
    .logo {
      font-size: 1.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .logo-icon { font-size: 1.8rem; }
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
    .filter-section {
      background: white;
      padding: 1.3rem;
      border-radius: 12px;
      margin-bottom: 1.8rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-top: 4px solid var(--primary);
    }
    .filter-section h3 { margin-bottom: 0.8rem; color: var(--primary-dark); font-size: 1.2rem; }
    select {
      padding: 0.8rem 1rem;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
      max-width: 300px;
      background-color: white;
      font-weight: 500;
    }
    select:focus { outline: none; border-color: var(--primary); }
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .article-card {
      background: white;
      border-radius: 12px;
      padding: 1.4rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.09);
      transition: all 0.3s ease;
      border-left: 4px solid var(--primary);
      position: relative;
      overflow: hidden;
    }
    .article-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 4px;
      background: linear-gradient(to right, #10b981, #0ea5e9);
    }
    .article-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(30, 58, 138, 0.15);
    }
    .article-category {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .article-name { font-weight: 600; font-size: 1.15rem; margin-bottom: 0.7rem; }
    .article-price { color: var(--primary-dark); font-weight: bold; font-size: 1.4rem; margin-bottom: 1rem; }
    .add-to-cart {
      background: linear-gradient(to right, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(30, 58, 138, 0.3);
    }
    .add-to-cart:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.4);
    }
    .cart-icon {
      position: fixed;
      bottom: 1.8rem; right: 1.8rem;
      background: linear-gradient(to right, var(--primary), var(--primary-dark));
      color: white;
      width: 60px; height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(30, 58, 138, 0.4);
      z-index: 100;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(30, 58, 138, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(30, 58, 138, 0); }
      100% { box-shadow: 0 0 0 0 rgba(30, 58, 138, 0); }
    }
    .cart-count {
      position: absolute;
      top: -8px; right: -8px;
      background-color: #ef4444;
      color: white;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      border: 2px solid white;
    }
    .cart-modal, .checkout-modal, .success-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .cart-content, .checkout-content, .success-content {
      background: white;
      width: 90%;
      max-width: 550px;
      border-radius: 16px;
      padding: 2.2rem;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      position: relative;
    }
    .checkout-content, .success-content { max-width: 500px; text-align: center; }
    .cart-content::before, .checkout-content::before, .success-content::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 4px;
      background: linear-gradient(to right, #10b981, #0ea5e9);
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 600; font-size: 1rem; }
    .cart-item-price { color: var(--primary-dark); font-weight: bold; font-size: 1rem; }
    .quantity-controls { display: flex; align-items: center; gap: 10px; margin-left: 15px; }
    .quantity-btn {
      width: 32px; height: 32px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .quantity-display {
      min-width: 32px;
      text-align: center;
      font-weight: bold;
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .cart-total {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--primary-dark);
      margin: 1.5rem 0;
      text-align: right;
      padding-top: 1.2rem;
      border-top: 3px double #e2e8f0;
    }
    .checkout-btn {
      background: linear-gradient(to right, var(--success), #0d9488);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 10px;
      width: 100%;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1.2rem;
    }
    .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--gray);
      width: 35px; height: 35px;
      border-radius: 50%;
    }
    .checkout-content h2, .success-content h2 {
      color: var(--primary-dark);
      margin-bottom: 1.5rem;
      font-size: 1.6rem;
    }
    input {
      width: 100%;
      padding: 1rem;
      margin: 0.8rem 0;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      text-align: left;
    }
    input:focus { outline: none; border-color: var(--primary); }
    .input-error { border-color: #ef4444 !important; }
    .error-hint {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: -0.5rem;
      margin-bottom: 0.5rem;
      display: none;
      text-align: left;
    }
    .loading { text-align: center; padding: 3rem; font-size: 1.2rem; color: var(--gray); }
    .error-message {
      background-color: #fef2f2;
      color: #b91c1c;
      padding: 1.5rem;
      border-radius: 12px;
      margin: 1.5rem 0;
      font-size: 0.95rem;
      line-height: 1.6;
      border-left: 4px solid #ef4444;
      text-align: left;
    }
    .success-icon { font-size: 4rem; color: var(--success); margin-bottom: 1rem; }
    .success-message {
      color: var(--gray);
      margin: 1.5rem 0;
      line-height: 1.7;
      text-align: left;
      background-color: #f8fafc;
      padding: 1.5rem;
      border-radius: 12px;
      max-height: 50vh;
      overflow-y: auto;
      font-size: 1rem;
      border: 1px solid #e2e8f0;
      white-space: pre-line;
    }
    .close-success-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 10px;
      width: 100%;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .articles-grid { grid-template-columns: 1fr; }
      .logo { font-size: 1.6rem; }
      .cart-icon { width: 55px; height: 55px; font-size: 1.3rem; }
      .container { padding: 0 1rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🛒</span>
      <span>PROCURE SHOP</span>
    </div>
  </header>

  <div class="container">
    <div class="filter-section">
      <h3>Filtrer par catégorie</h3>
      <select id="category-filter" onchange="filterArticles()">
        <option value="all">Toutes les catégories</option>
      </select>
    </div>
    <div class="articles-grid" id="articles-container">
      <div class="loading">Chargement des articles...</div>
    </div>
  </div>

  <div class="cart-icon" onclick="openCart()">
    🛒
    <span class="cart-count" id="cart-count">0</span>
  </div>

  <div class="cart-modal" id="cart-modal">
    <div class="cart-content">
      <button class="close-btn" onclick="closeCart()">×</button>
      <h2>Votre panier</h2>
      <div id="cart-items"></div>
      <div class="cart-total">Total: <span id="cart-total">0</span> FCFA</div>
      <button class="checkout-btn" onclick="openCheckout()">Valider la commande</button>
    </div>
  </div>

  <div class="checkout-modal" id="checkout-modal">
    <div class="checkout-content">
      <button class="close-btn" onclick="closeCheckout()">×</button>
      <h2>Vérification</h2>
      <input type="text" id="customer-name" placeholder="Nom complet *" required>
      <input type="tel" id="customer-phone" placeholder="Numéro WhatsApp avec indicatif (ex: 22890393720) *" required>
      <div class="error-hint" id="phone-error">Le numéro doit commencer par l'indicatif du pays (ex: 228, 221, 225...)</div>
      <div class="cart-total">Total à payer: <span id="checkout-total">0</span> FCFA</div>
      <button class="checkout-btn" onclick="sendOrder()">Confirmer la commande</button>
    </div>
  </div>

  <div class="success-modal" id="success-modal">
    <div class="success-content">
      <div class="success-icon">✓</div>
      <h2>Commande confirmée</h2>
      <p class="success-message" id="success-message"></p>
      <button class="close-success-btn" onclick="closeSuccess()">Fermer</button>
    </div>
  </div>

  <script>
    // =====================================================
    // CONFIGURATION — SEULE PARTIE À COMPLÉTER
    // =====================================================
    // Collez entre les guillemets l'URL de votre script Apps Script (finit par /exec)
    const APPS_SCRIPT_URL = "COLLEZ_ICI_VOTRE_URL_EXEC";

    // URL de la feuille Articles (déjà remplie — ne pas modifier)
    const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRO9Ylv3GrLJI6OtTQu5sC9MY2-2IdZ-G-uxltTBbVnQ9L8ztg_LGtK-HSrRbnIeYlu21j29-FhF9Cw/pub?gid=0&single=true&output=csv";

    // Notification Telegram du vendeur (facultatif — laisser vide pour désactiver)
    const TELEGRAM_BOT_TOKEN = "";
    const TELEGRAM_CHAT_ID = "";
    // =====================================================

    let articles = [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let categories = new Set();

    // ---------- Chargement des articles (avec délai de sécurité) ----------
    async function loadArticles() {
      const container = document.getElementById('articles-container');
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(function () { controller.abort(); }, 10000);
        const response = await fetch(GOOGLE_SHEET_URL, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const csvText = await response.text();
        parseCSV(csvText);
      } catch (error) {
        console.error('Erreur chargement articles:', error);
        container.innerHTML =
          '<div class="error-message"><strong>Erreur de chargement des articles.</strong><br>' +
          'Vérifiez : 1) que la feuille Articles est publiée en CSV, ' +
          '2) que les colonnes sont Catégorie, Article, Prix, ' +
          '3) votre connexion internet.</div>';
      }
    }

    function parseCSVLine(line) {
      const values = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
        else current += c;
      }
      values.push(current.trim());
      return values;
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      if (lines.length < 2) { showError('Fichier vide ou mal formaté.'); return; }
      const headers = lines[0].split(',').map(function (h) { return h.trim().replace(/^"|"$/g, ''); });
      const catCol = headers.findIndex(function (h) { return /cat[eé]gorie/i.test(h); });
      const nameCol = headers.findIndex(function (h) { return /article|produit|nom|name/i.test(h); });
      const priceCol = headers.findIndex(function (h) { return /prix|price|montant/i.test(h); });
      if (catCol === -1 || nameCol === -1 || priceCol === -1) {
        showError('Colonnes incorrectes. Attendu : Catégorie, Article, Prix.');
        return;
      }
      articles = [];
      categories.clear();
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        if (values.length < 3) continue;
        const category = (values[catCol] || '').trim() || 'Divers';
        const name = (values[nameCol] || '').trim();
        const price = parseInt((values[priceCol] || '').replace(/\D/g, '')) || 0;
        if (name && price > 0) {
          articles.push({ id: i, category: category, name: name, price: price });
          categories.add(category);
        }
      }
      if (articles.length === 0) { showError('Aucun article valide trouvé.'); return; }
      displayCategories();
      displayArticles(articles);
      updateCart();
    }

    function showError(message) {
      document.getElementById('articles-container').innerHTML =
        '<div class="error-message">' + message + '</div>';
    }

    function displayCategories() {
      const select = document.getElementById('category-filter');
      while (select.options.length > 1) select.remove(1);
      Array.from(categories).sort().forEach(function (cat) {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function displayArticles(items) {
      const container = document.getElementById('articles-container');
      if (items.length === 0) {
        container.innerHTML = '<div class="loading">Aucun article dans cette catégorie</div>';
        return;
      }
      container.innerHTML = items.map(function (a) {
        return '<div class="article-card">' +
          '<div class="article-category">' + a.category + '</div>' +
          '<div class="article-name">' + a.name + '</div>' +
          '<div class="article-price">' + a.price.toLocaleString('fr-FR') + ' FCFA</div>' +
          '<button class="add-to-cart" onclick="addToCart(' + a.id + ')">Ajouter au panier</button>' +
        '</div>';
      }).join('');
    }

    function filterArticles() {
      const cat = document.getElementById('category-filter').value;
      const filtered = cat === 'all' ? articles : articles.filter(function (a) { return a.category === cat; });
      displayArticles(filtered);
    }

    // ---------- Panier ----------
    function addToCart(id) {
      const article = articles.find(function (a) { return a.id === id; });
      if (!article) return;
      const existing = cart.find(function (i) { return i.id === id; });
      if (existing) existing.quantity++;
      else cart.push(Object.assign({}, article, { quantity: 1 }));
      saveCart();
      updateCart();
      setTimeout(function () { alert('Article ajouté au panier avec succès !'); }, 100);
    }

    function updateCart() {
      document.getElementById('cart-count').textContent = cart.reduce(function (s, i) { return s + i.quantity; }, 0);
      const total = cart.reduce(function (s, i) { return s + (i.price * i.quantity); }, 0);
      document.getElementById('cart-total').textContent = total.toLocaleString('fr-FR');
      document.getElementById('checkout-total').textContent = total.toLocaleString('fr-FR');
      const itemsEl = document.getElementById('cart-items');
      if (cart.length === 0) { itemsEl.innerHTML = '<p>Votre panier est vide</p>'; return; }
      itemsEl.innerHTML = cart.map(function (i) {
        return '<div class="cart-item">' +
          '<div class="cart-item-info">' +
            '<div class="cart-item-name">' + i.name + '</div>' +
            '<div class="cart-item-price">' + i.price.toLocaleString('fr-FR') + ' FCFA x ' + i.quantity + '</div>' +
          '</div>' +
          '<div class="quantity-controls">' +
            '<button class="quantity-btn" onclick="changeQuantity(' + i.id + ', -1)">-</button>' +
            '<span class="quantity-display">' + i.quantity + '</span>' +
            '<button class="quantity-btn" onclick="changeQuantity(' + i.id + ', 1)">+</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function changeQuantity(id, delta) {
      const item = cart.find(function (i) { return i.id === id; });
      if (!item) return;
      if (delta === -1 && item.quantity <= 1) {
        if (confirm('Retirer ' + item.name + ' du panier ?')) {
          cart = cart.filter(function (i) { return i.id !== id; });
        }
      } else {
        item.quantity += delta;
      }
      saveCart();
      updateCart();
    }

    function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); }

    function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
    function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

    function openCheckout() {
      if (cart.length === 0) { setTimeout(function () { alert('Votre panier est vide'); }, 100); return; }
      closeCart();
      document.getElementById('customer-phone').classList.remove('input-error');
      document.getElementById('phone-error').style.display = 'none';
      document.getElementById('checkout-modal').style.display = 'flex';
    }
    function closeCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }
    function closeSuccess() {
      document.getElementById('success-modal').style.display = 'none';
      cart = [];
      saveCart();
      updateCart();
    }

    // ---------- Validation du numéro (indicatif obligatoire) ----------
    function isValidPhoneNumber(phone) {
      const prefixes = ['228','221','225','226','223','224','222','229','227','233','234'];
      const clean = phone.replace(/\D/g, '');
      return prefixes.some(function (p) { return clean.startsWith(p); });
    }

    // ---------- Commande ----------
    async function sendOrder() {
      const name = document.getElementById('customer-name').value.trim();
      const phoneInput = document.getElementById('customer-phone');
      const phone = phoneInput.value.trim();
      const total = cart.reduce(function (s, i) { return s + (i.price * i.quantity); }, 0);

      if (!name) { setTimeout(function () { alert('Veuillez entrer votre nom complet'); }, 100); return; }
      if (!phone) { setTimeout(function () { alert('Veuillez entrer votre numéro WhatsApp'); }, 100); return; }
      if (!isValidPhoneNumber(phone)) {
        phoneInput.classList.add('input-error');
        document.getElementById('phone-error').style.display = 'block';
        setTimeout(function () { alert('Le numéro doit commencer par l\'indicatif du pays (ex: 228).'); }, 100);
        return;
      }
      phoneInput.classList.remove('input-error');
      document.getElementById('phone-error').style.display = 'none';

      // 1. Enregistrement automatique dans la feuille Commandes
      if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('http') === 0) {
        const orderPayload = JSON.stringify({
          action: 'add',
          order: {
            ref: 'R' + Date.now() + '-' + Math.floor(Math.random() * 10000),
            date: new Date().toLocaleDateString('fr-FR') + ' ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
            client: name,
            phone: phone,
            articles: cart.map(function (i) { return i.name + ' x' + i.quantity + ' = ' + (i.price * i.quantity).toLocaleString('fr-FR') + ' FCFA'; }).join(', '),
            total: String(total),
            status: 'En attente',
            notes: ''
          }
        });
        try {
          await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: orderPayload });
        } catch (err) {
          try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: orderPayload });
          } catch (err2) { console.error('Enregistrement impossible:', err2); }
        }
      }

      // 2. Message WhatsApp de confirmation au client
      let clientMessage = 'Bonjour ' + name + ',\n\nMerci pour votre commande chez PROCURE SHOP !\n\nRappel de votre commande :\n';
      cart.forEach(function (i) { clientMessage += '- ' + i.name + ' x ' + i.quantity + '\n'; });
      clientMessage += '\nTotal : ' + total.toLocaleString('fr-FR') + ' FCFA\n\nVotre commande est en cours de préparation. Nous vous contacterons dès qu\'elle sera prête pour la livraison.\n\nÀ très bientôt !';
      window.open('https://wa.me/' + phone.replace(/\D/g, '') + '?text=' + encodeURIComponent(clientMessage), '_blank');

      // 3. Notification Telegram du vendeur (si configurée)
      if (TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
        let sellerMessage = 'NOUVELLE COMMANDE\nClient : ' + name + '\nWhatsApp : ' + phone + '\nTotal : ' + total.toLocaleString('fr-FR') + ' FCFA\n\n' + cart.map(function (i) { return '- ' + i.name + ' x ' + i.quantity; }).join('\n');
        try {
          await fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage?chat_id=' + TELEGRAM_CHAT_ID + '&text=' + encodeURIComponent(sellerMessage));
        } catch (e) { console.error('Erreur Telegram:', e); }
      }

      // 4. Écran de confirmation
      let orderDetails = 'Client : ' + name + '\nWhatsApp : ' + phone + '\n\nArticles :\n';
      cart.forEach(function (i) { orderDetails += '- ' + i.name + ' x ' + i.quantity + ' = ' + (i.price * i.quantity).toLocaleString('fr-FR') + ' FCFA\n'; });
      orderDetails += '\nTOTAL : ' + total.toLocaleString('fr-FR') + ' FCFA';
      document.getElementById('success-message').textContent = orderDetails;
      closeCheckout();
      document.getElementById('success-modal').style.display = 'flex';
      setTimeout(function () { alert('Commande confirmée ! Merci pour votre confiance.'); }, 300);

      // 5. Vider le panier
      cart = [];
      saveCart();
      updateCart();
    }

    window.onclick = function (event) {
      if (event.target.id === 'cart-modal') closeCart();
      if (event.target.id === 'checkout-modal') closeCheckout();
      if (event.target.id === 'success-modal') closeSuccess();
    };

    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(loadArticles, 300);
    });
  </script>
</body>
</html>
